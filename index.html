<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; margin-top: 20px;}
    th, td { text-align: center; vertical-align: middle; white-space: nowrap; font-size: 14px;}
    .bg-M { background-color: #b7e1cd !important; }
    .bg-E { background-color: #fce8b2 !important; }
    .bg-N { background-color: #f4c7c3 !important; }
    .bg-O { background-color: #fff2cc !important; font-weight: bold;}
    .header-row { background-color: #e0e0e0 !important; font-weight: bold; }
    #loader { display: none; margin-left: 15px; color: #0d6efd; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container-fluid">
    <h2 class="mb-4 text-primary">⚙️ BSVI & OLD SRU Rota Dashboard</h2>
    
    <div class="row g-3 align-items-center bg-white p-3 rounded shadow-sm">
      <div class="col-auto">
        <label class="col-form-label fw-bold">Select Month:</label>
      </div>
      <div class="col-auto">
        <select id="month" class="form-select">
          <option value="January">January</option> <option value="February">February</option>
          <option value="March">March</option> <option value="April">April</option>
          <option value="May">May</option> <option value="June">June</option>
          <option value="July">July</option> <option value="August">August</option>
          <option value="September" selected>September</option> <option value="October">October</option>
          <option value="November">November</option> <option value="December">December</option>
        </select>
      </div>
      <div class="col-auto">
        <label class="col-form-label fw-bold">Select Year:</label>
      </div>
      <div class="col-auto">
        <input type="number" id="year" class="form-control" value="2026">
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" onclick="generateRota()">🚀 Generate Preview</button>
      </div>
      <div class="col-auto">
        <button class="btn btn-success" id="saveBtn" onclick="saveRota()" disabled>💾 Save to Google Sheet & History</button>
      </div>
      <div class="col-auto">
        <span id="loader">Processing... Please wait.</span>
      </div>
    </div>

    <!-- Yahan Rota ka preview aayega -->
    <div class="table-container mt-4" id="tableContainer">
      <h5 class="text-muted text-center mt-3">Preview will appear here...</h5>
    </div>
  </div>

  <script>
    let currentRosterData = []; // Data hold karne ke liye

    function showLoader(show) {
      document.getElementById('loader').style.display = show ? 'inline-block' : 'none';
    }

    // 1. Google Apps script backend function call karna
    function generateRota() {
      const month = document.getElementById('month').value;
      const year = document.getElementById('year').value;
      showLoader(true);
      document.getElementById('saveBtn').disabled = true;
      
      google.script.run
        .withSuccessHandler(function(data) {
          currentRosterData = data;
          renderTable(data);
          showLoader(false);
          document.getElementById('saveBtn').disabled = false;
        })
        .withFailureHandler(function(err) {
          alert("Error: " + err.message);
          showLoader(false);
        })
        .generateRotaData(month, year);
    }

    // 2. Table ko HTML me draw karna Colors ke sath
    function renderTable(data) {
      let html = '<table class="table table-bordered table-sm"><tbody>';
      
      for(let r = 0; r < data.length; r++) {
        html += '<tr>';
        for(let c = 0; c < data[r].length; c++) {
          let cellValue = data[r][c];
          let cssClass = '';
          
          if(r < 2) cssClass = 'header-row'; // First 2 rows bold
          else if(c > 1) { // Dates wale columns me color apply karna
            if(cellValue.startsWith('M')) cssClass = 'bg-M';
            else if(cellValue.startsWith('E')) cssClass = 'bg-E';
            else if(cellValue.startsWith('N')) cssClass = 'bg-N';
            else if(cellValue === 'O') cssClass = 'bg-O';
          }
          
          html += `<td class="${cssClass}">${cellValue}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('tableContainer').innerHTML = html;
    }

    // 3. Save button dabane par wapas backend ko data bhejna
    function saveRota() {
      const month = document.getElementById('month').value;
      showLoader(true);
      google.script.run
        .withSuccessHandler(function(res) {
          alert("✅ Final Rota saved successfully in Google Sheet and History!");
          showLoader(false);
        })
        .saveRotaToSheet(currentRosterData, month);
    }
  </script>
</body>
</html>
